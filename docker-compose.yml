# docker-compose is finalized in the deployment phase (Day 3).
# Placeholder keeps the service contract explicit:
#   backend: FastAPI app (uvicorn) at :8000
#   frontend: React PWA static build served at :8080
services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
