services:
  # Deterministic engine + Policy Engine + REST API
  backend:
    build: ./backend
    container_name: celengan-api
    environment:
      # LLM is opt-in; leave empty to run 100% deterministic (recommended default)
      CELENGAN_LLM_ENABLED: ${CELENGAN_LLM_ENABLED:-}
      CELENGAN_LLM_API_KEY: ${CELENGAN_LLM_API_KEY:-}
      CELENGAN_LLM_BASE_URL: ${CELENGAN_LLM_BASE_URL:-}
      CELENGAN_LLM_MODEL: ${CELENGAN_LLM_MODEL:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # React PWA served by nginx, /api proxied to the backend
  frontend:
    build: ./frontend
    container_name: celengan-app
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
