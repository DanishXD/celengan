# GitHub Pages: self-contained STATIC DEMO of Celengan.
#
# Ships the whole Detect → Simulate → Execute story with no backend: the
# deterministic engine's frozen outputs (built by backend/demo/export_static)
# plus a browser-side Policy Engine port that CI proves byte-identical to the
# Python original (frontend/scripts/parity.ts).
# Live deployments (docker-compose / own host) keep running the real API.

name: Deploy static demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- deterministic engine snapshot (ground truth for the demo) ----
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export deterministic snapshot
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m demo.export_static
        working-directory: backend

      # ---- frontend build + parity gate ----
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Parity check — browser port vs Python engine
        run: npm run demo-parity
        working-directory: frontend
      - name: Build (static demo, /celengan/ base)
        run: npm run build -- --base=/celengan/ --outDir=dist-pages --emptyOutDir
        env:
          VITE_STATIC_DEMO: "1"
        working-directory: frontend
      - name: SPA fallback for deep links
        run: cp frontend/dist-pages/index.html frontend/dist-pages/404.html

      # ---- publish ----
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
