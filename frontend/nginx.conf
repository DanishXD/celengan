# Celengan frontend — SPA fallback + /api proxy to the backend container
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -- SPA routing: every unknown path serves the app shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -- API proxy (matches the dev-mode /api prefix)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
