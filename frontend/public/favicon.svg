<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#15563B"/>
  <!-- coin dropping toward the slot -->
  <circle cx="30" cy="13" r="7.5" fill="#E4B45C"/>
  <!-- pig body -->
  <ellipse cx="33" cy="40" rx="23" ry="16" fill="#F7F3E7"/>
  <!-- ear -->
  <path d="M16 28 L23 17 L29 27 Z" fill="#E9E2CE"/>
  <!-- snout, poking right -->
  <circle cx="56" cy="38" r="6.5" fill="#E9E2CE"/>
  <!-- legs -->
  <rect x="20" y="52" width="8" height="7" rx="3" fill="#E9E2CE"/>
  <rect x="38" y="52" width="8" height="7" rx="3" fill="#E9E2CE"/>
  <!-- eye -->
  <circle cx="42" cy="33" r="2" fill="#15563B"/>
  <!-- coin slot -->
  <rect x="27" y="34.5" width="12" height="3.6" rx="1.8" fill="#15563B"/>
</svg>
